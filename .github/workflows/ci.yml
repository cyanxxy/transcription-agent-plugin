name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh plugins/transcription-agent-cli/bin/transcriber-cli plugins/transcription-agent-cli/mcp/launch plugins/transcription-agent-mcp/scripts/launch-mcp.sh tests/*_test.sh mcpb/build.sh mcpb/launch
      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json .cursor-plugin/marketplace.json \
                   plugins/transcription-agent/plugin.json \
                   plugins/transcription-agent/.claude-plugin/plugin.json \
                   plugins/transcription-agent/.codex-plugin/plugin.json \
                   plugins/transcription-agent/.cursor-plugin/plugin.json \
                   plugins/transcription-agent-cli/.claude-plugin/plugin.json \
                   plugins/transcription-agent-mcp/plugin.json \
                   plugins/transcription-agent-mcp/.codex-plugin/plugin.json \
                   plugins/transcription-agent-mcp/.mcp.json plugins/transcription-agent-mcp/mcp.json \
                   mcpb/manifest.json server.json; do
            python3 -m json.tool "$f" >/dev/null
          done
      - name: Installer and wrapper tests
        run: |
          bash tests/install_test.sh
          bash tests/mcp_launcher_test.sh
          bash tests/claude_mcp_launcher_test.sh
      - name: Transcript viewer lifecycle tests
        run: node --test tests/viewer_test.mjs
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: plugins/transcription-agent-cli/mcp-server/go.mod
      - name: MCP server tests
        working-directory: plugins/transcription-agent-cli/mcp-server
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: plugins/transcription-agent-cli/mcp-server/go.mod
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Build and validate the MCPB bundles
        run: |
          bash mcpb/build.sh darwin dist
          bash mcpb/build.sh linux dist
      - name: Validate server.json
        run: |
          python3 -m pip install --quiet jsonschema
          curl -fsSL https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json -o /tmp/server.schema.json
          python3 -c 'import json, jsonschema; jsonschema.validate(json.load(open("server.json")), json.load(open("/tmp/server.schema.json")))'

  plugin-manifests:
    runs-on: ubuntu-latest
    env:
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # A plugin-directory run checks only the manifest, so the skills folder is
      # validated on its own.
      - name: Validate Claude Code marketplace, plugins, and skill
        run: |
          claude plugin validate . --strict
          claude plugin validate ./plugins/transcription-agent --strict
          claude plugin validate ./plugins/transcription-agent/skills --strict
          claude plugin validate ./plugins/transcription-agent-cli --strict
      - name: Validate Agent Plugins manifest
        run: |
          python3 -m pip install --quiet jsonschema
          curl -fsSL https://agent-plugins.org/schemas/1.0.0/plugin.schema.json -o /tmp/agent-plugin.schema.json
          python3 - <<'EOF'
          import json, jsonschema
          schema = json.load(open("/tmp/agent-plugin.schema.json"))
          validator = jsonschema.Draft202012Validator(schema)
          for name in ("transcription-agent", "transcription-agent-mcp"):
              validator.validate(json.load(open(f"plugins/{name}/plugin.json")))
          EOF
          curl -fsSL https://agent-plugins.org/schemas/1.0.0/mcp.schema.json -o /tmp/agent-mcp.schema.json
          python3 -c 'import json, jsonschema; jsonschema.Draft202012Validator(json.load(open("/tmp/agent-mcp.schema.json"))).validate(json.load(open("plugins/transcription-agent-mcp/mcp.json")))'
