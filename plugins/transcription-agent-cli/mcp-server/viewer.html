<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcript viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff; --surface: #f5f5f7; --surface-2: #ececf1; --text: #202126; --muted: #666873; --border: #dedee5;
      --accent: #6d28d9; --highlight: #fff0b8; --danger: #b42318;
      --s0: #6d28d9; --s1: #0e7490; --s2: #c2410c; --s3: #15803d; --s4: #be185d; --s5: #1d4ed8; --s6: #a16207; --s7: #4d7c0f; --sx: #8a8b94;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --bg: #202024; --surface: #29292e; --surface-2: #323238; --text: #efeff3; --muted: #b6b6c1; --border: #404048;
      --accent: #b897ff; --highlight: #624c16; --danger: #ff8a7a;
      --s0: #b897ff; --s1: #5fd4e8; --s2: #ffa06b; --s3: #6ee38f; --s4: #ff85c0; --s5: #8fb4ff; --s6: #f2c94c; --s7: #b5e36a; --sx: #8f909a;
    } }
    :root[data-theme="dark"] {
      --bg: #202024; --surface: #29292e; --surface-2: #323238; --text: #efeff3; --muted: #b6b6c1; --border: #404048;
      --accent: #b897ff; --highlight: #624c16; --danger: #ff8a7a;
      --s0: #b897ff; --s1: #5fd4e8; --s2: #ffa06b; --s3: #6ee38f; --s4: #ff85c0; --s5: #8fb4ff; --s6: #f2c94c; --s7: #b5e36a; --sx: #8f909a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--color-background-primary, var(--bg)); color: var(--color-text-primary, var(--text)); font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif); font-size: 14px; line-height: 1.5; }
    main { padding: 18px 20px; max-width: 100%; display: flex; flex-direction: column; gap: 12px; }
    :root[data-fill] main, :root[data-mode="fullscreen"] main { height: 100vh; }
    .muted { color: var(--color-text-secondary, var(--muted)); }
    [hidden] { display: none !important; }

    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    h1 { font-size: 18px; line-height: 1.25; letter-spacing: -.02em; margin: 0 0 4px; font-weight: 650; overflow-wrap: anywhere; }
    #metadata { font-size: 12px; margin: 0; overflow-wrap: anywhere; }
    .head-actions { display: flex; align-items: center; gap: 6px; flex: none; }
    .badge { display: inline-flex; font-size: 11px; font-weight: 650; letter-spacing: .035em; padding: 4px 8px; border-radius: 6px; background: var(--color-background-secondary, var(--surface)); color: var(--color-text-secondary, var(--muted)); }

    input, button { font: inherit; border: 1px solid var(--color-border-primary, var(--border)); border-radius: 7px; background: var(--color-background-primary, var(--bg)); color: inherit; }
    input { width: 100%; height: 34px; padding: 6px 10px; }
    input:focus-visible, button:focus-visible, pre:focus-visible, .conversation:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button { cursor: pointer; min-height: 34px; padding: 5px 11px; font-size: 12px; font-weight: 550; transition: background-color .15s ease, border-color .15s ease; }
    button:hover:enabled { background: var(--color-background-secondary, var(--surface)); }
    button:disabled { cursor: default; opacity: .5; }
    .icon { width: 34px; padding: 0; display: inline-grid; place-items: center; }
    .icon svg { width: 16px; height: 16px; }
    :root[data-mode="fullscreen"] .expand, :root:not([data-mode="fullscreen"]) .collapse { display: none; }

    .progress { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 12px; padding: 14px; border-radius: 10px; background: var(--color-background-secondary, var(--surface)); }
    .progress strong { display: block; font-size: 13px; font-weight: 600; }
    .progress .detail { display: block; font-size: 12px; overflow-wrap: anywhere; }
    .wave { display: flex; align-items: center; gap: 3px; height: 22px; }
    .wave span { width: 3px; height: 100%; border-radius: 2px; background: var(--accent); animation: wave 1.1s ease-in-out infinite; }
    .wave span:nth-child(2) { animation-delay: -.9s; } .wave span:nth-child(3) { animation-delay: -.7s; } .wave span:nth-child(4) { animation-delay: -.5s; } .wave span:nth-child(5) { animation-delay: -.3s; }
    @keyframes wave { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
    #elapsed { font: 600 13px/1 var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace); font-variant-numeric: tabular-nums; color: var(--color-text-secondary, var(--muted)); }
    .progress .hint { grid-column: 1 / -1; margin: 6px 0 0; font-size: 11px; }

    .file { margin: 0; padding: 9px 12px; border: 1px solid var(--color-border-primary, var(--border)); border-radius: 8px; overflow-wrap: anywhere; font-size: 12px; }
    .file span { display: block; margin-bottom: 2px; font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-secondary, var(--muted)); }

    .speakers { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { --c: var(--sx); display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 4px 10px 4px 8px; border-radius: 999px; position: relative; overflow: hidden; }
    .chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
    .chip .share { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--color-text-secondary, var(--muted)); }
    .chip .meter { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--c); opacity: .7; }
    .chip[aria-pressed="false"] { opacity: .45; }
    .chip[aria-pressed="false"]::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .segmented { display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; background: var(--color-background-secondary, var(--surface)); }
    .segmented button { border: 0; min-height: 30px; background: transparent; color: var(--color-text-secondary, var(--muted)); }
    .segmented button[aria-selected="true"] { background: var(--color-background-primary, var(--bg)); color: inherit; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
    .search { flex: 1 1 140px; min-width: 0; display: flex; }
    .navigation { display: flex; align-items: center; gap: 4px; }
    .navigation button { width: 30px; padding: 3px; }
    #match-count { font-size: 11px; min-width: 42px; text-align: center; color: var(--color-text-secondary, var(--muted)); }
    #match-count:empty { min-width: 0; }
    .busy .toolbar, .busy #transcript { display: none; }
    #notice { margin: 0; font-size: 12px; color: var(--color-text-secondary, var(--muted)); }
    #notice:empty { display: none; }
    .failed #notice { color: var(--danger); }

    .scroll { max-height: 420px; overflow-y: auto; overscroll-behavior: contain; border-radius: 10px; }
    :root[data-fill] .scroll, :root[data-mode="fullscreen"] .scroll { flex: 1; min-height: 0; max-height: none; }
    pre { margin: 0; padding: 14px; background: var(--color-background-secondary, var(--surface)); font: 13px/1.7 var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace); white-space: pre-wrap; overflow-wrap: anywhere; }
    mark { background: var(--highlight); color: inherit; border-radius: 2px; }
    mark.current { outline: 1.5px solid var(--accent); }

    .conversation { display: flex; flex-direction: column; gap: 2px; padding: 4px 0; border: 1px solid var(--color-border-primary, var(--border)); }
    .turn { --c: var(--sx); display: grid; grid-template-columns: 32px 1fr; gap: 10px; padding: 9px 12px; border-radius: 8px; }
    .turn.enter { animation: rise .22s ease-out both; }
    .turn:hover, .turn:focus-within { background: var(--color-background-secondary, var(--surface)); }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
    .turn-meta { display: flex; align-items: baseline; gap: 8px; min-height: 22px; }
    .turn-meta .name { font-weight: 650; font-size: 13px; color: var(--c); overflow-wrap: anywhere; }
    .turn-meta time { font: 11px/1 var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace); color: var(--color-text-secondary, var(--muted)); font-variant-numeric: tabular-nums; }
    .turn-copy { margin-left: auto; min-height: 22px; padding: 1px 8px; font-size: 11px; opacity: 0; }
    .turn:hover .turn-copy, .turn:focus-within .turn-copy { opacity: 1; }
    @media (hover: none) { .turn-copy { opacity: 1; } }
    .turn p { margin: 1px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .s0 { --c: var(--s0); } .s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .s3 { --c: var(--s3); } .s4 { --c: var(--s4); } .s5 { --c: var(--s5); } .s6 { --c: var(--s6); } .s7 { --c: var(--s7); }
    .empty { padding: 18px; text-align: center; font-size: 12px; }
    @keyframes rise { from { opacity: 0; transform: translateY(3px); } }

    .ask { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 2px; }
    .ask > span { font-size: 12px; margin-right: 2px; }
    .ask button { border-radius: 999px; }
    footer { min-height: 18px; font-size: 11px; color: var(--color-text-secondary, var(--muted)); }
    @media (prefers-reduced-motion: reduce) { .turn, .wave span { animation: none; } }
    @media (max-width: 420px) { main { padding: 14px; } .search { flex-basis: 100%; } .scroll { max-height: 340px; } .turn { grid-template-columns: 1fr; } .avatar { display: none; } }
  </style>
</head>
<body>
<main id="app">
  <header>
    <div><h1 id="heading">Transcript</h1><p id="metadata" class="muted">Waiting for the transcription result…</p></div>
    <div class="head-actions">
      <span id="format" class="badge" hidden></span>
      <button id="fullscreen" class="icon" aria-label="Open full screen" title="Full screen" hidden>
        <svg class="expand" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M10 2.5h3.5V6M6 13.5H2.5V10M13.5 2.5 9 7M2.5 13.5 7 9"/></svg>
        <svg class="collapse" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M13.5 6H10V2.5M2.5 10H6v3.5M10 6l3.5-3.5M6 10l-3.5 3.5"/></svg>
      </button>
    </div>
  </header>
  <section id="progress" class="progress" role="status" hidden>
    <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <div><strong id="progress-title">Transcribing…</strong><span id="progress-detail" class="detail muted"></span></div>
    <span id="elapsed" aria-label="Elapsed time"></span>
    <p class="hint muted">Long recordings can take several minutes. The transcript appears here when it is ready.</p>
  </section>
  <p class="file" id="file" hidden><span id="file-label">Saved file</span><b id="path"></b></p>
  <div id="speakers" class="speakers" role="group" aria-label="Show or hide speakers" hidden></div>
  <div class="toolbar">
    <div id="views" class="segmented" role="tablist" aria-label="Transcript view" hidden>
      <button id="view-conversation" role="tab" aria-selected="true">Conversation</button>
      <button id="view-raw" role="tab" aria-selected="false">File</button>
    </div>
    <div class="search"><input id="search" type="search" placeholder="Find in transcript" aria-label="Find in transcript" disabled></div>
    <div class="navigation"><button id="previous" aria-label="Previous match" disabled>↑</button><span id="match-count" aria-live="polite"></span><button id="next" aria-label="Next match" disabled>↓</button></div>
    <button id="copy" disabled>Copy transcript</button>
    <button id="load" hidden>Load full transcript</button>
  </div>
  <p id="notice" role="status"></p>
  <div id="conversation" class="conversation scroll" role="list" tabindex="0" aria-label="Transcript by speaker" hidden></div>
  <pre id="transcript" class="scroll" tabindex="0" aria-label="Transcript text">The transcript will appear here when it is ready.</pre>
  <div id="ask" class="ask" hidden>
    <span class="muted">Ask about it</span>
    <button id="ask-summary">Summarize</button>
    <button id="ask-actions">Action items</button>
    <button id="ask-decisions">Decisions</button>
  </div>
  <footer id="feedback" role="status" aria-live="polite"></footer>
</main>
<script>
(() => {
  // The documented MCP Apps postMessage bridge keeps this HTML self-contained.
  // No network assets or additional runtime/build dependencies are needed.
  // Transcript text and speaker names are untrusted: they only ever reach the
  // page through textContent and text nodes, never as markup.
  const ids = ['app', 'heading', 'metadata', 'format', 'fullscreen', 'progress', 'progress-title', 'progress-detail', 'elapsed', 'file', 'file-label', 'path', 'speakers',
    'views', 'view-conversation', 'view-raw', 'search', 'previous', 'next', 'match-count', 'copy', 'load', 'notice', 'conversation', 'transcript',
    'ask', 'ask-summary', 'ask-actions', 'ask-decisions', 'feedback'];
  const el = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const pending = new Map();
  let nextId = 1, text = '', result = null, parsed = null, view = 'raw', hidden = new Set(), matches = [], current = -1, generation = 0, loading = false, connected = false;
  let hostCapabilities = {}, hostContext = {}, elapsedTimer = null, startedAt = 0, animateTurns = false;
  const uiVersion = '2026-01-26';
  const maxResourceChars = 8 * 1024 * 1024;
  const maxTurnSeconds = 120;
  const modelNames = { 'gemini-3.5-transcribe': 'Gemini 3.5 Transcribe', 'muse-voice-transcribe-1.0': 'Meta Muse Voice Transcribe', 'MAI-Transcribe-2': 'Microsoft MAI-Transcribe-2' };
  const prompts = {
    summary: path => `Summarize the transcript saved at ${path}: the main topics, what each speaker contributed, and the outcome.`,
    actions: path => `List the action items in the transcript saved at ${path}, with the owner and any deadline mentioned for each.`,
    decisions: path => `List the decisions made and the open questions left in the transcript saved at ${path}.`,
  };

  function notify(method, params = {}) {
    window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
  }
  function request(method, params) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { pending.delete(id); reject(new Error('The host did not respond.')); }, 15000);
      pending.set(id, { resolve, reject, timer });
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    });
  }

  // ---- Host context: theme, styles, display mode, container size ----
  function applyHostContext(context) {
    if (!context || typeof context !== 'object') return;
    Object.assign(hostContext, context);
    const root = document.documentElement;
    if (context.theme === 'light' || context.theme === 'dark') root.dataset.theme = context.theme;
    const allowed = ['--color-background-primary', '--color-background-secondary', '--color-text-primary', '--color-text-secondary', '--color-border-primary', '--font-sans', '--font-mono'];
    for (const name of allowed) {
      const value = context.styles?.variables?.[name];
      if (typeof value === 'string') root.style.setProperty(name, value);
      else if (value === null) root.style.removeProperty(name);
    }
    if (typeof context.displayMode === 'string') root.dataset.mode = context.displayMode;
    if (context.containerDimensions && typeof context.containerDimensions === 'object') {
      if (typeof context.containerDimensions.height === 'number') root.dataset.fill = 'true'; else delete root.dataset.fill;
    }
    const fullscreen = root.dataset.mode === 'fullscreen';
    el.fullscreen.hidden = !(connected && Array.isArray(hostContext.availableDisplayModes) && hostContext.availableDisplayModes.includes(fullscreen ? 'inline' : 'fullscreen'));
    el.fullscreen.setAttribute('aria-label', fullscreen ? 'Exit full screen' : 'Open full screen');
    el.fullscreen.title = fullscreen ? 'Exit full screen' : 'Full screen';
  }
  async function toggleFullscreen() {
    const mode = document.documentElement.dataset.mode === 'fullscreen' ? 'inline' : 'fullscreen';
    try {
      const response = await request('ui/request-display-mode', { mode });
      applyHostContext({ displayMode: typeof response?.mode === 'string' ? response.mode : mode });
    } catch (error) {
      el.feedback.textContent = error.message || 'The host could not change the display mode.';
    }
  }

  // ---- Parsing the engine's export formats into speaker segments ----
  function seconds(value) {
    if (typeof value === 'number' && Number.isFinite(value)) return Math.max(0, value);
    if (typeof value !== 'string') return null;
    const m = /^\[?(?:(\d+):)?(\d{1,2}):(\d{2})(?:[.,](\d{1,3}))?\]?$/.exec(value.trim());
    if (!m) return null;
    return Number(m[1] || 0) * 3600 + Number(m[2]) * 60 + Number(m[3]) + (m[4] ? Number(m[4].padEnd(3, '0')) / 1000 : 0);
  }
  function clock(value) {
    const total = Math.max(0, Math.floor(value));
    const h = Math.floor(total / 3600), m = Math.floor(total % 3600 / 60), s = String(total % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
  }
  const clean = value => (typeof value === 'string' ? value : '').trim();
  function fromText(raw) {
    const lines = raw.split(/\r?\n/).filter(line => line.trim());
    const segments = [];
    for (let i = 0; i < lines.length; i++) {
      const stamped = /^\[(\d{2}:\d{2}:\d{2})\]\s+([^:]{1,80}?):\s?(.*)$/.exec(lines[i]);
      const plain = stamped ? null : /^([^:[\]]{1,80}?):\s(.+)$/.exec(lines[i]);
      if (stamped) segments.push({ start: seconds(stamped[1]), speaker: stamped[2], text: stamped[3] });
      else if (plain) segments.push({ start: null, speaker: plain[1], text: plain[2] });
      else if (i !== lines.length - 1) return null; // only a cut-off last preview line may not match
    }
    return { segments };
  }
  function fromMarkdown(raw) {
    const unescape = value => value.replace(/\\([\\`*_[\]<>#|])/g, '$1');
    const segments = [];
    let currentTurn = null;
    for (const line of raw.split(/\r?\n/)) {
      const value = line.trim();
      if (!value) continue;
      const head = /^\*\*(.+?)\*\*(?:\s+·\s+`([\d:]+)`)?$/.exec(value);
      if (head) { currentTurn = { start: head[2] ? seconds(head[2]) : null, speaker: unescape(head[1]), text: '' }; segments.push(currentTurn); }
      else if (currentTurn) currentTurn.text += (currentTurn.text ? ' ' : '') + unescape(value);
      else if (!/^# /.test(value) && !/^_.*_$/.test(value)) return null;
    }
    return { segments };
  }
  function fromCues(raw, format) {
    const unescape = value => value.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
    const segments = [];
    let speaker = '';
    for (const block of raw.replace(/\r/g, '').split(/\n{2,}/)) {
      const lines = block.split('\n');
      const at = lines.findIndex(line => line.includes('-->'));
      if (at < 0) continue;
      const [from, to = ''] = lines[at].split('-->');
      const start = seconds(from), end = seconds(to.trim().split(/\s+/)[0] || '');
      if (start === null) return null;
      let body = lines.slice(at + 1).join(' ').trim(), named = null;
      if (format === 'vtt') {
        const voice = /^<v(?:\.[^\s>]*)?\s+([^>]+)>/.exec(body);
        if (voice) { named = unescape(voice[1].trim()); body = body.slice(voice[0].length); }
        body = unescape(body.replace(/<[^>]*>/g, ''));
      } else {
        const label = /^([^:]{1,60}):\s+/.exec(body);
        if (label) { named = label[1].trim(); body = body.slice(label[0].length); }
      }
      const previous = segments[segments.length - 1];
      if (!named && previous) { previous.text += ' ' + body; previous.end = end; continue; }
      speaker = named || speaker || 'Speaker';
      segments.push({ start, end, speaker, text: body });
    }
    return { segments };
  }
  function parseCSV(raw) {
    const rows = [];
    let row = [], cell = '', quoted = false;
    for (let i = 0; i < raw.length; i++) {
      const c = raw[i];
      if (quoted) {
        if (c === '"' && raw[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') quoted = false; else cell += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && raw[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function fromCSV(raw) {
    const rows = parseCSV(raw);
    if (rows[0]?.join(',') !== 'start,end,speaker,text') return null;
    // The engine prefixes cells a spreadsheet would run as formulas with '.
    const unguard = value => /^'[=+\-@\t\r]/.test(value) ? value.slice(1) : value;
    return { segments: rows.slice(1).filter(row => row.length === 4).map(row => ({ start: seconds(row[0]), end: seconds(row[1]), speaker: unguard(row[2]), text: unguard(row[3]) })) };
  }
  function fromJSON(raw) {
    const data = JSON.parse(raw);
    if (!Array.isArray(data?.segments)) return null;
    return {
      duration: Number(data.metadata?.duration) || 0,
      segments: data.segments.map(s => ({ start: seconds(s?.start) ?? seconds(s?.timestamp), end: seconds(s?.end), speaker: clean(s?.speaker), text: clean(s?.text) })),
    };
  }
  function parseTranscript(raw, format) {
    try {
      const parsers = { json: fromJSON, csv: fromCSV, srt: r => fromCues(r, 'srt'), vtt: r => fromCues(r, 'vtt'), md: fromMarkdown };
      const out = (parsers[format] || fromText)(raw);
      if (!out) return null;
      const segments = out.segments.map(s => ({ ...s, speaker: clean(s.speaker) || 'Speaker', text: clean(s.text) })).filter(s => s.text);
      if (!segments.length) return null;
      const turns = [];
      for (const s of segments) {
        const last = turns[turns.length - 1];
        if (last && last.speaker === s.speaker && (s.start === null || last.start === null || s.start - last.start < maxTurnSeconds)) {
          last.text += ' ' + s.text; last.end = s.end ?? s.start ?? last.end;
        } else turns.push({ speaker: s.speaker, start: s.start, end: s.end ?? s.start, text: s.text });
      }
      const speakers = [], stats = new Map();
      for (const t of turns) {
        if (!stats.has(t.speaker)) { stats.set(t.speaker, { name: t.speaker, words: 0, turns: 0, tone: t.speaker === 'Untranscribed' ? 'sx' : `s${speakers.filter(s => s.tone !== 'sx').length % 8}` }); speakers.push(stats.get(t.speaker)); }
        const entry = stats.get(t.speaker);
        if (entry.tone !== 'sx') entry.words += t.text.split(/\s+/).filter(Boolean).length;
        entry.turns++;
      }
      const duration = out.duration || Math.max(0, ...turns.map(t => t.end ?? t.start ?? 0));
      return { turns, speakers, stats, duration, words: speakers.reduce((sum, s) => sum + s.words, 0) };
    } catch (_) {
      return null;
    }
  }

  // ---- Rendering ----
  function initials(name) {
    const words = name.split(/\s+/).filter(Boolean);
    if (words.length > 1 && /^\d+$/.test(words[words.length - 1])) return (words[0][0] + words[words.length - 1]).slice(0, 3).toUpperCase();
    return words.slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  }
  function searchPattern() {
    const query = el.search.value;
    return query ? new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'giu') : null;
  }
  // Appends value to parent with literal search hits wrapped in <mark>.
  function appendHighlighted(parent, value, pattern) {
    if (!pattern) { parent.textContent = value; return; }
    pattern.lastIndex = 0;
    let offset = 0, match = pattern.exec(value);
    while (match && matches.length < 1000) {

      const mark = document.createElement('mark');
      mark.textContent = match[0];
      parent.appendChild(mark); matches.push(mark);
      offset = match.index + match[0].length; match = pattern.exec(value);
    }
    parent.appendChild(document.createTextNode(value.slice(offset)));
  }
  function renderSpeakers() {
    el.speakers.replaceChildren();
    el.speakers.hidden = !parsed || parsed.speakers.length < 1;
    if (el.speakers.hidden) return;
    for (const speaker of parsed.speakers) {
      // Untranscribed gap markers are not people, so they get no talk share.
      const share = parsed.words && speaker.tone !== 'sx' ? Math.round(speaker.words / parsed.words * 100) : 0;
      const chip = document.createElement('button');
      chip.className = `chip ${speaker.tone}`;
      chip.setAttribute('aria-pressed', String(!hidden.has(speaker.name)));
      chip.title = speaker.tone === 'sx' ? `${speaker.turns} untranscribed ${speaker.turns === 1 ? 'gap' : 'gaps'}. Click to show or hide.` : `${speaker.turns} ${speaker.turns === 1 ? 'turn' : 'turns'}, ${speaker.words} words. Click to show or hide.`;
      const name = document.createElement('span'); name.textContent = speaker.name;
      const amount = document.createElement('span'); amount.className = 'share'; amount.textContent = speaker.tone === 'sx' ? `${speaker.turns}×` : `${share}%`;
      const meter = document.createElement('span'); meter.className = 'meter'; meter.style.width = `${share}%`;
      chip.appendChild(name); chip.appendChild(amount); chip.appendChild(meter);
      chip.addEventListener('click', () => {
        if (hidden.has(speaker.name)) hidden.delete(speaker.name);
        else if (hidden.size < parsed.speakers.length - 1) hidden.add(speaker.name);
        renderSpeakers(); render();
      });
      el.speakers.appendChild(chip);
    }
  }
  function visibleTurns() {
    return parsed ? parsed.turns.filter(t => !hidden.has(t.speaker)) : [];
  }
  const turnLine = t => `${t.speaker}${t.start === null ? '' : ` (${clock(t.start)})`}: ${t.text}`;
  function renderConversation(pattern) {
    el.conversation.replaceChildren();
    const turns = visibleTurns();
    if (!turns.length) {
      const empty = document.createElement('p'); empty.className = 'empty muted'; empty.textContent = 'No speakers selected.';
      el.conversation.appendChild(empty); return;
    }
    const tones = parsed.stats;
    for (const t of turns) {
      const item = document.createElement('article');
      item.className = `turn ${tones.get(t.speaker).tone}${animateTurns ? ' enter' : ''}`;
      item.setAttribute('role', 'listitem');
      const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.setAttribute('aria-hidden', 'true'); avatar.textContent = initials(t.speaker);
      const body = document.createElement('div');
      const meta = document.createElement('div'); meta.className = 'turn-meta';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = t.speaker;
      meta.appendChild(name);
      if (t.start !== null) { const time = document.createElement('time'); time.textContent = clock(t.start); meta.appendChild(time); }

      const paragraph = document.createElement('p');
      appendHighlighted(paragraph, t.text, pattern);
      body.appendChild(meta); body.appendChild(paragraph);

  }
  function renderRaw(pattern) {
    el.transcript.replaceChildren();

      el.transcript.appendChild(fragment);
    }
  }
  function render() {
    const pattern = text ? searchPattern() : null;
    matches = []; current = -1;
    const conversation = Boolean(parsed) && view === 'conversation';
    el.conversation.hidden = !conversation;
    el.transcript.hidden = conversation;
    el.views.hidden = !parsed;
    el['view-conversation'].setAttribute('aria-selected', String(conversation));
    el['view-raw'].setAttribute('aria-selected', String(!conversation));

    if (matches.length) moveMatch(1, false);

    if (!matches.length) el['match-count'].textContent = pattern ? '0 found' : '';

  }
  function moveMatch(direction, scroll = true) {
    if (!matches.length) return;
    if (current >= 0) matches[current].classList.remove('current');
    current = (current + direction + matches.length) % matches.length;
    matches[current].classList.add('current');
    el['match-count'].textContent = `${current + 1}/${matches.length}${matches.length === 1000 ? '+' : ''}`;
    if (scroll) matches[current].scrollIntoView({ block: 'nearest' });
  }
  function updateActions() {
    const filtered = Boolean(parsed) && view === 'conversation' && hidden.size > 0;
    el.search.disabled = !text;
    el.copy.disabled = !text;
    el.copy.textContent = filtered ? 'Copy shown' : result?.truncated ? 'Copy preview' : 'Copy transcript';
    el.load.hidden = !(connected && result?.truncated && typeof result.resource_uri === 'string' && hostCapabilities.serverResources);
    el.load.disabled = loading;
    el.load.textContent = loading ? 'Loading…' : 'Load full transcript';
    el.ask.hidden = !(connected && text && typeof result?.output_path === 'string' && result.output_path);
  }
  function setView(next) {
    view = next; render();
  }
  function describe() {
    const parts = [modelNames[result.model] || result.model];
    if (parsed?.duration) parts.push(clock(parsed.duration));
    if (parsed) {
      const people = parsed.speakers.filter(s => s.tone !== 'sx').length || 1;
      parts.push(`${people} ${people === 1 ? 'speaker' : 'speakers'}`, `${new Intl.NumberFormat().format(parsed.words)} words`);
    }
    else if (Number.isFinite(result.bytes)) parts.push(`${new Intl.NumberFormat().format(result.bytes)} bytes saved`);
    return parts.filter(Boolean).join(' · ');
  }
  function title(path) {
    const name = typeof path === 'string' ? path.split(/[\\/]/).pop() : '';
    return name ? name.replace(/\.[^.]+$/, '') || name : '';
  }

  // ---- Lifecycle: transcribing, result, failure ----
  function stopTimer() {
    if (elapsedTimer !== null) clearTimeout(elapsedTimer);
    elapsedTimer = null;
  }
  function tick() {
    el.elapsed.textContent = clock((Date.now() - startedAt) / 1000);
    elapsedTimer = setTimeout(tick, 1000);
  }
  function showInput(params) {
    const args = params?.arguments;
    if (result || !args || typeof args !== 'object') return;
    const audio = typeof args.audio_path === 'string' ? args.audio_path.split(/[\\/]/).pop() : '';
    const model = modelNames[args.model] || (typeof args.model === 'string' ? args.model : modelNames['gemini-3.5-transcribe']);
    el.progress.hidden = false; el.app.className = 'busy';
    el.heading.textContent = 'Transcribing';
    el.metadata.textContent = 'Sending the recording to the speech provider.';
    el['progress-title'].textContent = audio ? `Transcribing ${audio}` : 'Transcribing…';
    el['progress-detail'].textContent = [model, typeof args.format === 'string' ? args.format.toUpperCase() : ''].filter(Boolean).join(' · ');
    if (elapsedTimer === null) { startedAt = Date.now(); tick(); }
  }
  function resetView() {
    stopTimer(); el.progress.hidden = true;
    generation++; loading = false; el.feedback.textContent = ''; el.search.value = '';
    parsed = null; hidden = new Set(); view = 'raw';
    el.app.className = '';
  }
  function showResult(toolResult) {
    resetView();
    result = toolResult?.structuredContent ?? null;
    if (toolResult?.isError || result?.error) {
      const failure = result?.error;
      const recoveredPath = typeof failure?.recovery_output_path === 'string' ? failure.recovery_output_path : '';
      text = ''; result = null;
      el.app.className = 'failed';
      el.heading.textContent = 'Transcription failed';
      el.metadata.textContent = recoveredPath ? 'Transcript saved to recovery file.' : 'No transcript is available from this call.';
      el.path.textContent = recoveredPath; el['file-label'].textContent = 'Recovery file';
      el.file.hidden = !recoveredPath; el.format.hidden = true;
      el.notice.textContent = [failure?.message || 'The transcription could not be completed.', recoveredPath && failure?.next_action].filter(Boolean).join(' ');
      renderSpeakers(); render(); el.transcript.textContent = recoveredPath ? 'Open the saved recovery file to view the transcript.' : 'No transcript was returned from this call.'; return;
    }
    if (!result || typeof result.transcript !== 'string') { result = null; return; }
    text = result.transcript;
    parsed = parseTranscript(text, typeof result.format === 'string' ? result.format : 'txt');
    view = parsed ? 'conversation' : 'raw';
    animateTurns = true;
    el.heading.textContent = title(result.output_path) || 'Transcript';
    el.metadata.textContent = describe();
    el.path.textContent = typeof result.output_path === 'string' ? result.output_path : '';
    el['file-label'].textContent = Number.isFinite(result.bytes) ? `Saved file · ${new Intl.NumberFormat().format(result.bytes)} bytes` : 'Saved file';
    el.file.hidden = !el.path.textContent;
    el.format.textContent = typeof result.format === 'string' ? result.format.toUpperCase() : '';
    el.format.hidden = !el.format.textContent;
    el.notice.textContent = result.truncated ? 'This is a shortened preview. Search, speakers, and copy apply to the preview; the saved file contains the full transcript.' : '';
    renderSpeakers(); render();
  }
  async function loadFull() {
    if (!result?.truncated || !hostCapabilities.serverResources || loading) return;
    const uri = result.resource_uri, started = generation;
    if (typeof uri !== 'string' || !uri) return;
    loading = true; updateActions(); el.feedback.textContent = '';
    try {
      const response = await request('resources/read', { uri });
      if (generation !== started) return;
      const content = response?.contents;
      if (!Array.isArray(content) || content.length !== 1 || content[0].uri !== uri || typeof content[0].text !== 'string') throw new Error('The host did not return the requested transcript.');
      if (content[0].text.length > maxResourceChars) throw new Error('This transcript is too large for the viewer. Open the saved file.');
      text = content[0].text; result = { ...result, truncated: false };
      const wasParsed = Boolean(parsed);
      parsed = parseTranscript(text, typeof result.format === 'string' ? result.format : 'txt');
      if (!parsed) view = 'raw'; else if (!wasParsed) view = 'conversation';
      hidden = new Set([...hidden].filter(name => parsed?.stats.has(name)));
      el.metadata.textContent = describe();
      el.notice.textContent = ''; el.feedback.textContent = 'Full transcript loaded.';
      renderSpeakers(); render();
    } catch (error) {
      if (generation === started) el.feedback.textContent = `${error.message || 'Could not load the full transcript.'} The preview is still available; open the saved file for the full text.`;
    } finally {
      if (generation === started) { loading = false; updateActions(); }
    }
  }

  // ---- Actions ----
  async function writeClipboard(value, done) {
    try {
      if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
      await navigator.clipboard.writeText(value);
      el.feedback.textContent = done;
      return true;
    } catch (_) {
      return false;
    }
  }
  async function copyText() {
    if (!text) return;
    const filtered = Boolean(parsed) && view === 'conversation' && hidden.size > 0;
    const value = filtered ? visibleTurns().map(turnLine).join('\n\n') : text;
    if (await writeClipboard(value, filtered ? 'Shown speakers copied.' : result?.truncated ? 'Preview copied.' : 'Transcript copied.')) return;

    if (selection) { const range = document.createRange(); range.selectNodeContents(target); selection.removeAllRanges(); selection.addRange(range); }
    el.feedback.textContent = 'Text selected. Use your browser or system Copy command.';
  }
  async function ask(kind) {
    const path = result?.output_path;
    if (!connected || typeof path !== 'string' || !path) return;
    try {
      await request('ui/message', { role: 'user', content: [{ type: 'text', text: prompts[kind](path) }] });
      el.feedback.textContent = 'Sent to the chat.';
    } catch (error) {
      el.feedback.textContent = error.message || 'The host did not accept the message.';
    }
  }

  function receive(event) {

    else if (message.method === 'ui/notifications/host-context-changed') applyHostContext(message.params);
    else if (message.method === 'ui/notifications/tool-cancelled') showResult({ isError: true, structuredContent: { error: { message: 'Transcription was cancelled.' } } });
    else if (message.method === 'ping' && message.id !== undefined) window.parent.postMessage({ jsonrpc: '2.0', id: message.id, result: {} }, '*');

      pending.clear(); window.parent.postMessage({ jsonrpc: '2.0', id: message.id, result: {} }, '*');

  el.search.addEventListener('input', render);
  el.search.addEventListener('keydown', event => {
    if (event.key === 'Enter') { event.preventDefault(); moveMatch(event.shiftKey ? -1 : 1); }
    else if (event.key === 'Escape' && el.search.value) { event.preventDefault(); el.search.value = ''; render(); }
  });

  el.next.addEventListener('click', () => moveMatch(1));
  el.copy.addEventListener('click', copyText);
  el.load.addEventListener('click', loadFull);
  el.fullscreen.addEventListener('click', toggleFullscreen);
  el['view-conversation'].addEventListener('click', () => setView('conversation'));
  el['view-raw'].addEventListener('click', () => setView('raw'));
  el['ask-summary'].addEventListener('click', () => ask('summary'));
  el['ask-actions'].addEventListener('click', () => ask('actions'));
  el['ask-decisions'].addEventListener('click', () => ask('decisions'));

    if (connected) notify('ui/notifications/size-changed', { width: Math.ceil(document.body.getBoundingClientRect().width), height: Math.ceil(document.body.getBoundingClientRect().height) });
  }) : null;
  observer?.observe(document.body);
  request('ui/initialize', { appInfo: { name: 'transcription-agent-viewer', version: '2.0.0' }, appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] }, protocolVersion: uiVersion }).then(response => {

  }).catch(() => { el.feedback.textContent = 'Interactive host connection is unavailable. The saved transcript remains accessible from the tool result.'; });
})();
</script>
